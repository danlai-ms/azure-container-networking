trigger: none
pr: none

schedules:
  - cron: "*/5 * * * *"
    displayName: Temporary remediation E2E canary
    branches:
      include:
        - sre-remediation/dependabot-security/azure-container-networking-security
    always: true

pool:
  name: Networking-ContainerNetworking-VMSS

jobs:
  - job: validate
    displayName: Validate remediation E2E canary
    timeoutInMinutes: 60
    steps:
      - checkout: self
        clean: true
        fetchDepth: 0

      - bash: |
          set -euo pipefail

          if [[ "${BUILD_REPOSITORY_NAME}" != "danlai-ms/azure-container-networking" ]]; then
            echo "Refusing non-canary repository: ${BUILD_REPOSITORY_NAME}" >&2
            exit 1
          fi

          if [[ "${BUILD_SOURCEBRANCH}" != "refs/heads/sre-remediation/dependabot-security/azure-container-networking-security" ]]; then
            echo "Refusing non-canary branch: ${BUILD_SOURCEBRANCH}" >&2
            exit 1
          fi

          echo "Repository: ${BUILD_REPOSITORY_NAME}"
          echo "Branch: ${BUILD_SOURCEBRANCH}"
          echo "Validated revision: ${BUILD_SOURCEVERSION}"

          go version
          go test ./...
        displayName: Validate scheduled canary revision
