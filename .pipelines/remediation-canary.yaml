trigger: none
pr:
  branches:
    include:
      - master

pool:
  name: Networking-ContainerNetworking-VMSS

jobs:
  - job: validate
    displayName: Validate remediation candidate
    timeoutInMinutes: 60
    steps:
      - checkout: self
        clean: true
        fetchDepth: 0

      - bash: |
          set -euo pipefail

          if [[ "${BUILD_REPOSITORY_NAME}" != "danlai-ms/azure-container-networking" ]]; then
            echo "Refusing non-canary repository: ${BUILD_REPOSITORY_NAME}" >&2
            exit 1
          fi

          PR_HEAD_SHA="${SYSTEM_PULLREQUEST_SOURCECOMMITID:-${ACN_CANARY_GITHUB_HEAD_SHA:-${BUILD_SOURCEVERSION}}}"
          if [[ -z "${PR_HEAD_SHA}" ]]; then
            echo "Unable to determine the GitHub PR head SHA" >&2
            exit 1
          fi

          if [[ -n "${ACN_CANARY_GITHUB_HEAD_SHA:-}" && "${PR_HEAD_SHA}" != "${ACN_CANARY_GITHUB_HEAD_SHA}" ]]; then
            echo "PR head ${PR_HEAD_SHA}, expected ${ACN_CANARY_GITHUB_HEAD_SHA}" >&2
            exit 1
          fi

          echo "Validating GitHub PR ${SYSTEM_PULLREQUEST_PULLREQUESTNUMBER:-${ACN_CANARY_GITHUB_PR_NUMBER:-unknown}}"
          echo "Repository: ${BUILD_REPOSITORY_NAME}"
          echo "Branch: ${BUILD_SOURCEBRANCH}"
          echo "PR head SHA: ${PR_HEAD_SHA}"
          echo "Checked out revision: ${BUILD_SOURCEVERSION}"

          go version
          go test ./...
        displayName: Validate exact GitHub revision
        env:
          SYSTEM_PULLREQUEST_PULLREQUESTNUMBER: $(System.PullRequest.PullRequestNumber)
          SYSTEM_PULLREQUEST_SOURCECOMMITID: $(System.PullRequest.SourceCommitId)
